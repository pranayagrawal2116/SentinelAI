name: SentinelAI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend Lint & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinel-ai/backend/requirements.txt

      - name: Syntax Check Backend Files
        run: |
          python -m py_compile sentinel-ai/backend/main.py
          python -m py_compile sentinel-ai/backend/auto_run.py
          python -m py_compile sentinel-ai/backend/ml_modules/module1_feature_intelligence/pipeline.py
          python -m py_compile sentinel-ai/backend/ml_modules/module2_detection_engine/trainer.py
          python -m py_compile sentinel-ai/backend/ml_modules/module3_security_analytics/evaluator.py

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sentinel-ai/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: sentinel-ai/frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: sentinel-ai/frontend
        run: npm run build
